<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GreenLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(160deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
        }
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 800;
            font-size: 1.3rem;
            color: #064e3b;
            text-decoration: none;
        }
        .logo .icon {
            background: #059669;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }
        h2 {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            color: #064e3b;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.35rem;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        /* Role cards */
        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }
        .role-option input { display: none; }
        .role-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            padding: 1rem 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .role-label:hover {
            border-color: #a7f3d0;
            background: #f0fdf4;
        }
        .role-option input:checked + .role-label {
            border-color: #10b981;
            background: #ecfdf5;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .role-icon {
            font-size: 1.8rem;
        }
        .role-name {
            font-weight: 700;
            font-size: 0.8rem;
            color: #064e3b;
        }
        .role-desc {
            font-size: 0.7rem;
            color: #6b7280;
            line-height: 1.3;
        }
        .btn {
            width: 100%;
            padding: 0.85rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            transition: all 0.3s;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(16, 185, 129, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .footer-text {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #6b7280;
        }
        .footer-text a {
            color: #059669;
            font-weight: 600;
            text-decoration: none;
        }
        /* Toast */
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #dc2626;
            color: white;
            padding: 0.85rem 1.4rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 9999;
            pointer-events: none;
        }
        #toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div id="toast"></div>

    <div class="card">
        <div class="logo">
            <a href="index.html">
                <span class="icon">🚨</span>
                GreenLink
            </a>
        </div>

        <h2>Create Staff Account</h2>
        <p class="subtitle">Register as Traffic Incharge or Police Officer</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password <span style="color:#9ca3af;font-weight:400">(min 6 characters)</span></label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>

            <label style="margin-bottom: 0.5rem;">Select Your Role</label>
            <div class="role-options">
                <div class="role-option">
                    <input type="radio" name="role" id="roleIncharge" value="incharge">
                    <label for="roleIncharge" class="role-label">
                        <span class="role-icon">👮</span>
                        <span class="role-name">Traffic Incharge</span>
                        <span class="role-desc">Manage alerts & assign officers</span>
                    </label>
                </div>
                <div class="role-option">
                    <input type="radio" name="role" id="roleOfficer" value="officer">
                    <label for="roleOfficer" class="role-label">
                        <span class="role-icon">🚔</span>
                        <span class="role-name">Police Officer</span>
                        <span class="role-desc">Clear roads for vehicles</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn" id="submitBtn">Create Account</button>
        </form>

        <p class="footer-text">
            Already have an account? <a href="login.html">Sign in</a>
        </p>
    </div>

    <script type="module">
        import { registerUser } from "./js/auth.js";

        const form = document.getElementById("registerForm");
        const submitBtn = document.getElementById("submitBtn");

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            setTimeout(() => t.classList.remove("show"), 4000);
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const roleEl = document.querySelector("input[name='role']:checked");

            if (!roleEl) {
                showToast("⚠️ Please select a role to continue.");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Creating account…";

            try {
                await registerUser(name, email, password, roleEl.value);
            } catch (err) {
                showToast("❌ " + (err.message || "Registration failed."));
                submitBtn.disabled = false;
                submitBtn.textContent = "Create Account";
            }
        });
    </script>
</body>

</html>
