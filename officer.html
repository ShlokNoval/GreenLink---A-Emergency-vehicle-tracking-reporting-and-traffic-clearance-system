<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Dashboard | GreenLink</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Leaflet Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0fdf4; min-height: 100vh; display: flex; flex-direction: column; }

        .header {
            background: linear-gradient(135deg, #064e3b 0%, #059669 100%);
            padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .header-left { display: flex; align-items: center; gap: 0.75rem; }
        .header-left .icon { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .header-left .brand { color: white; }
        .header-left .brand-name { font-weight: 800; font-size: 1.3rem; }
        .header-left .brand-module { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: #a7f3d0; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .user-badge {
            display: flex; align-items: center; gap: 0.5rem;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            padding: 0.5rem 1rem; border-radius: 0.75rem; color: white; font-size: 0.85rem; font-weight: 600;
        }
        .logout-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 0.5rem 1rem; border-radius: 0.75rem;
            font-size: 0.82rem; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.2); }

        .main { flex: 1; max-width: 860px; margin: 0 auto; width: 100%; padding: 1.5rem 2rem; }

        /* Duty toggle */
        .duty-panel {
            background: white; border-radius: 1.25rem; border: 1px solid #e5e7eb;
            padding: 1.5rem 2rem; margin-bottom: 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .duty-info h2 { font-size: 1.1rem; font-weight: 800; color: #064e3b; margin-bottom: 0.25rem; }
        .duty-info p { font-size: 0.85rem; color: #6b7280; }
        .duty-info .status-label {
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.8rem; font-weight: 700; margin-top: 0.4rem;
            padding: 0.3rem 0.8rem; border-radius: 999px;
        }
        .status-active { background: #dcfce7; color: #166534; }
        .status-inactive { background: #fee2e2; color: #991b1b; }

        /* Toggle switch */
        .toggle-switch { position: relative; width: 60px; height: 32px; }
        .toggle-switch input { display: none; }
        .toggle-slider {
            position: absolute; inset: 0; background: #d1d5db; border-radius: 999px;
            cursor: pointer; transition: background 0.3s;
        }
        .toggle-slider::before {
            content: ''; position: absolute; left: 3px; top: 3px;
            width: 26px; height: 26px; border-radius: 50%;
            background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: transform 0.3s;
        }
        .toggle-switch input:checked + .toggle-slider { background: #10b981; }
        .toggle-switch input:checked + .toggle-slider::before { transform: translateX(28px); }

        /* Assignments */
        .panel {
            background: white; border-radius: 1.25rem; border: 1px solid #e5e7eb;
            overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .panel-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid #f3f4f6;
            display: flex; align-items: center; gap: 0.6rem;
            font-weight: 700; font-size: 0.95rem; color: #064e3b;
        }
        .panel-header .count-badge {
            margin-left: auto; font-size: 0.7rem; font-weight: 700;
            padding: 0.25rem 0.7rem; border-radius: 999px;
        }
        .panel-body { padding: 1rem 1.5rem; }

        .assignment-card {
            padding: 1.5rem; border-radius: 1rem; border: 2px solid #e5e7eb;
            margin-bottom: 1rem; transition: all 0.3s;
        }
        .assignment-card.assigned { border-color: #fbbf24; background: #fffbeb; }
        .assignment-card.clearing { border-color: #10b981; background: #f0fdf4; }
        .assignment-card.cleared { border-color: #d1d5db; background: #f9fafb; opacity: 0.6; }

        .assignment-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
        .assignment-vehicle { display: flex; align-items: center; gap: 0.6rem; }
        .assignment-vehicle .emoji { font-size: 1.6rem; }
        .assignment-vehicle .plate {
            font-family: 'JetBrains Mono', monospace; font-weight: 700;
            font-size: 1.1rem; color: #111827; letter-spacing: 1px;
        }
        .assignment-priority {
            font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.7rem;
            border-radius: 999px; text-transform: uppercase;
        }
        .assignment-priority.critical { background: #fee2e2; color: #dc2626; }
        .assignment-priority.high { background: #fef3c7; color: #d97706; }
        .assignment-priority.standard { background: #dcfce7; color: #059669; }

        .assignment-details { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-bottom: 1rem; }
        .detail-item { font-size: 0.82rem; }
        .detail-item .label { color: #9ca3af; font-weight: 500; }
        .detail-item .value { color: #111827; font-weight: 600; margin-top: 0.15rem; }

        .action-btn {
            width: 100%; padding: 0.75rem; border: none; border-radius: 0.75rem;
            font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
            transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-clearing { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #78350f; }
        .btn-clearing:hover { box-shadow: 0 6px 20px rgba(245,158,11,0.4); }
        .btn-cleared { background: linear-gradient(135deg, #059669, #10b981); color: white; }
        .btn-cleared:hover { box-shadow: 0 6px 20px rgba(16,185,129,0.4); }
        .btn-done { background: #e5e7eb; color: #6b7280; cursor: default; }

        .empty-state p { font-size: 0.9rem; }

        /* Modal & Map */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
            display: none; align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: white; border-radius: 1.25rem; padding: 2rem;
            width: 100%; max-width: 600px; box-shadow: 0 25px 80px rgba(0,0,0,0.2);
        }
        #map { height: 350px; width: 100%; border-radius: 1rem; margin-top: 1rem; }
        .assignment-map-preview { height: 200px; width: 100%; border-radius: 0.75rem; margin: 1rem 0; border: 1px solid #e5e7eb; }
        
        .track-btn {
            background: #1e293b; color: white; border: none; padding: 0.4rem 0.8rem;
            border-radius: 0.6rem; font-size: 0.72rem; font-weight: 600; cursor: pointer;
            display: inline-flex; align-items: center; gap: 0.3rem; margin-left: 0.5rem;
        }
        .modal-actions { margin-top: 1rem; display: flex; justify-content: flex-end; }
        .modal-close { background: #059669; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.75rem; font-weight: 600; cursor: pointer; }

        @media (max-width: 640px) {
            .main { padding: 1rem; }
            .duty-panel { flex-direction: column; gap: 1rem; text-align: center; }
            .assignment-details { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="header-left">
            <div class="icon">🚨</div>
            <div class="brand">
                <div class="brand-name">GreenLink</div>
                <div class="brand-module">Traffic Police Officer</div>
            </div>
        </div>
        <div class="header-right">
            <div class="user-badge">🚔 <span id="userName">Loading...</span></div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </header>

    <main class="main">
        <!-- Duty Toggle -->
        <div class="duty-panel">
            <div class="duty-info">
                <h2>Duty Status</h2>
                <p>Toggle your on-duty status. Incharge can only assign you when active.</p>
                <div class="status-label status-inactive" id="statusLabel">🔴 Off Duty</div>
            </div>
            <div class="toggle-switch">
                <input type="checkbox" id="dutyToggle">
                <label class="toggle-slider" for="dutyToggle"></label>
            </div>
        </div>

        <!-- Assigned Alerts -->
        <div class="panel">
            <div class="panel-header">
                <span>📋</span> Your Assignments
                <span class="count-badge" id="assignCount" style="background:#fef3c7;color:#92400e;">0</span>
            </div>
            <div class="panel-body" id="assignmentsContainer">
                <div class="empty-state">
                    <div class="emoji">📋</div>
                    <p>No assignments yet. Go on duty to receive alerts.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Map Modal -->
    <div class="modal-overlay" id="mapModal">
        <div class="modal">
            <h3 id="mapTitle">Vehicle Tracker</h3>
            <p>Tracking live GPS location of the emergency vehicle</p>
            <div id="map"></div>
            <div class="modal-actions">
                <button class="modal-close" onclick="closeMapModal()">Close Tracker</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { protectPage, getUserData, logoutUser, toggleOfficerStatus, listenOfficerAlerts, updateAlertStatus } from "./js/auth.js";

        const vehicleEmoji = { ambulance: '🚑', fire_engine: '🚒', police: '🚓' };

        // Auth guard (officer only)
        const user = await protectPage("officer");
        const userData = await getUserData(user.uid);
        document.getElementById("userName").textContent = userData?.name || "Officer";

        // Set initial duty status
        const dutyToggle = document.getElementById("dutyToggle");
        const statusLabel = document.getElementById("statusLabel");

        let locationInterval = null;

        if (userData?.isActive) {
            dutyToggle.checked = true;
            statusLabel.className = "status-label status-active";
            statusLabel.textContent = "🟢 On Duty";
            startLocationTracking();
        }

        dutyToggle.addEventListener("change", async () => {
            const isActive = dutyToggle.checked;
            statusLabel.className = "status-label " + (isActive ? "status-active" : "status-inactive");
            statusLabel.textContent = isActive ? "🟢 On Duty" : "🔴 Off Duty";
            
            if (isActive) {
                startLocationTracking();
            } else {
                if (locationInterval) clearInterval(locationInterval);
            }
            
            await toggleOfficerStatus(user.uid, isActive);
        });

        // Logout
        document.getElementById("logoutBtn").addEventListener("click", () => {
             if (locationInterval) clearInterval(locationInterval);
             logoutUser();
        });

        import { updateOfficerLocation } from "./js/auth.js";

        function startLocationTracking() {
            if (!navigator.geolocation) return;
            
            // Initial update
            navigator.geolocation.getCurrentPosition((pos) => {
                updateOfficerLocation(user.uid, pos.coords.latitude, pos.coords.longitude);
            });

            // Every 10 seconds for officers
            locationInterval = setInterval(() => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        updateOfficerLocation(user.uid, pos.coords.latitude, pos.coords.longitude)
                            .catch(err => console.error("Officer location update failed", err));
                    },
                    (err) => console.warn(err),
                    { enableHighAccuracy: true }
                );
            }, 10000);
        }

        const mapInstances = {};

        // Listen to assigned alerts in real-time
        listenOfficerAlerts(user.uid, (alerts) => {
            const container = document.getElementById("assignmentsContainer");
            const activeAlerts = alerts.filter(a => a.status !== "cleared");
            document.getElementById("assignCount").textContent = activeAlerts.length;

            if (alerts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">📋</div>
                        <p>No assignments yet. Go on duty to receive alerts.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = alerts.map(a => {
                const emoji = vehicleEmoji[a.vehicleType] || '🚗';
                const time = a.createdAt?.toDate ? a.createdAt.toDate().toLocaleTimeString() : 'Just now';

                let actionBtn = '';
                if (a.status === 'assigned') {
                    actionBtn = `<button class="action-btn btn-clearing" data-id="${a.id}" data-action="clearing">🚦 Start Clearing Road</button>`;
                } else if (a.status === 'clearing') {
                    actionBtn = `<button class="action-btn btn-cleared" data-id="${a.id}" data-action="cleared">✅ Mark As Cleared</button>`;
                } else if (a.status === 'cleared') {
                    actionBtn = `<button class="action-btn btn-done" disabled>✅ Completed</button>`;
                }

                // Show map if we have location and not cleared
                const mapHtml = (a.location && a.status !== 'cleared') ? `<div id="map-${a.id}" class="assignment-map-preview"></div>` : '';

                return `
                    <div class="assignment-card ${a.status}">
                        <div class="assignment-top">
                            <div class="assignment-vehicle">
                                <span class="emoji">${emoji}</span>
                                <span class="plate">${a.vehicleNumber}</span>
                            </div>
                            <span class="assignment-priority ${a.priority}">${a.priority}</span>
                        </div>
                        <div class="assignment-details">
                            <div class="detail-item">
                                <div class="label">Driver</div>
                                <div class="value">${a.driverName}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Phone</div>
                                <div class="value">${a.driverPhone}</div>
                            </div>
                            <div class="detail-item" style="grid-column: 1 / -1;">
                                <div class="label">Route</div>
                                <div class="value">📍 From: GPS detected &rarr; To: ${a.destination || a.route}</div>
                            </div>
                            <div class="detail-item">
                                <div class="label">Reported At</div>
                                <div class="value">${time}</div>
                            </div>
                        </div>
                        ${mapHtml}
                        ${actionBtn}
                    </div>
                `;
            }).join('');

            // Initialize or update maps for each assignment
            alerts.forEach(a => {
                const mapId = `map-${a.id}`;
                const mapEl = document.getElementById(mapId);
                if (!mapEl || !a.location) return;

                const lat = a.location.latitude;
                const lng = a.location.longitude;

                if (!mapInstances[a.id]) {
                    const m = L.map(mapId, { zoomControl: false }).setView([lat, lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
                    const marker = L.marker([lat, lng]).addTo(m);
                    mapInstances[a.id] = { map: m, marker: marker };
                } else {
                    mapInstances[a.id].map.setView([lat, lng]);
                    mapInstances[a.id].marker.setLatLng([lat, lng]);
                }
            });

            // Action buttons
            container.querySelectorAll('.action-btn:not([disabled])').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const alertId = btn.dataset.id;
                    const action = btn.dataset.action;
                    btn.disabled = true;
                    btn.textContent = 'Updating...';
                    try {
                        await updateAlertStatus(alertId, action);
                    } catch (err) {
                        alert('Error: ' + err.message);
                        btn.disabled = false;
                    }
                });
            });
        });

        // ── Map Logic ──
        let map = null;
        let marker = null;

        window.openMapModal = function(title, lat, lng) {
            document.getElementById("mapTitle").textContent = title;
            document.getElementById("mapModal").classList.add("open");

            if (!map) {
                map = L.map('map').setView([lat, lng], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);
                marker = L.marker([lat, lng]).addTo(map);
            } else {
                map.setView([lat, lng], 15);
                marker.setLatLng([lat, lng]);
            }
            
            setTimeout(() => map.invalidateSize(), 300);
        };

        window.closeMapModal = function() {
            document.getElementById("mapModal").classList.remove("open");
        };
    </script>
</body>

</html>
